<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>boredape · physarum</title>
<style>
  :root {
    --panel: rgba(12, 14, 20, 0.8);
    --ink: #e8e6df;
    --dim: #8a8b90;
    --line: rgba(255, 255, 255, 0.09);
    --accent: #3ef0c8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #05060a; overflow: hidden; }
  body { font: 12px/1.4 ui-monospace, "JetBrains Mono", "SF Mono", Menlo, monospace; color: var(--ink); }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; cursor: crosshair; touch-action: none; }

  #toggle {
    position: fixed; top: 16px; right: 16px; width: 32px; height: 32px; padding: 0;
    border-radius: 8px; background: var(--panel); backdrop-filter: blur(14px);
    font-size: 15px; line-height: 1; z-index: 2;
  }
  #panel {
    position: fixed; top: 56px; right: 16px; width: 280px;
    max-height: calc(100vh - 72px); overflow-y: auto;
    background: var(--panel); backdrop-filter: blur(14px) saturate(1.3);
    border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 14px 10px; transition: opacity .25s, transform .25s;
    scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.15) transparent;
  }
  #panel.hidden { opacity: 0; transform: translateX(12px); pointer-events: none; }
  @media (max-width: 640px) {
    #panel { top: auto; bottom: 8px; left: 8px; right: 8px; width: auto; max-height: 52vh; }
    #panel.hidden { transform: translateY(12px); }
    #toggle { top: 10px; right: 10px; }
  }
  h1 { font-size: 13px; margin: 0 0 2px; letter-spacing: .08em; text-transform: uppercase; }
  h1 span { color: var(--accent); }
  .sub { color: var(--dim); margin-bottom: 12px; }
  .section { border-top: 1px solid var(--line); padding: 8px 0 6px; }
  .label { color: var(--dim); text-transform: uppercase; letter-spacing: .1em; font-size: 10px; margin-bottom: 6px; }
  .hint { color: var(--dim); font-size: 10.5px; margin-top: 6px; }
  summary.label { cursor: pointer; list-style: none; margin-bottom: 0; }
  summary.label::-webkit-details-marker { display: none; }
  summary.label::after { content: " ▸"; }
  details[open] summary.label { margin-bottom: 6px; }
  details[open] summary.label::after { content: " ▾"; }

  .row { display: grid; grid-template-columns: 88px 1fr 38px; align-items: center; gap: 8px; margin: 2px 0; }
  .row output { text-align: right; color: var(--dim); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--accent); height: 14px; }
  .write { display: flex; gap: 5px; margin-top: 6px; }
  .write input {
    flex: 1; min-width: 0; font: inherit; color: var(--ink); background: rgba(255,255,255,0.05);
    border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; outline: none;
  }
  .write input:focus { border-color: var(--accent); }

  .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  button {
    font: inherit; color: var(--ink); background: rgba(255,255,255,0.05);
    border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; cursor: pointer;
  }
  button:hover { background: rgba(255,255,255,0.11); }
  button.on { border-color: var(--accent); color: var(--accent); }
  button.rec { border-color: #ff4d4d; color: #ff4d4d; }
  .swatch { display: inline-flex; gap: 2px; margin-right: 5px; vertical-align: -1px; }
  .swatch i { width: 7px; height: 9px; border-radius: 2px; display: block; box-shadow: 0 0 0 1px rgba(255,255,255,0.12); }

  .stats { color: var(--dim); display: flex; justify-content: space-between; padding-top: 8px; border-top: 1px solid var(--line); }
  .keys { color: var(--dim); font-size: 10.5px; margin-top: 6px; line-height: 1.7; }
  .keys b { color: var(--ink); font-weight: normal; border: 1px solid var(--line); border-radius: 3px; padding: 0 3px; }

  #toast {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
    background: var(--panel); border: 1px solid var(--line); border-radius: 20px;
    padding: 6px 14px; opacity: 0; transition: opacity .3s; pointer-events: none;
  }
  #toast.show { opacity: 1; }
  #drop {
    position: fixed; inset: 12px; border: 2px dashed var(--accent); border-radius: 14px;
    display: none; align-items: center; justify-content: center; font-size: 14px;
    background: rgba(0,0,0,0.35); pointer-events: none;
  }
  #drop.show { display: flex; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="toggle" title="panel (h)">≡</button>

<div id="panel">
  <h1>physarum<span>.</span></h1>
  <div class="sub">agents that smell, turn, walk, and leave a trail</div>

  <div class="section">
    <div class="label">Presets</div>
    <div class="chips" id="presets"></div>
  </div>

  <div class="section">
    <div class="label">Scene</div>
    <div class="chips">
      <button id="scene-dots">food dots</button>
      <button id="scene-maze">maze</button>
      <button id="scene-clear">clear</button>
    </div>
    <form class="write" id="write">
      <input id="write-text" type="text" maxlength="24" placeholder="grow a word…" autocomplete="off">
      <button type="submit">grow</button>
    </form>
    <div class="hint">or drop an image onto the canvas</div>
  </div>

  <div class="section">
    <div class="label">Brush</div>
    <div class="chips" id="brushes"></div>
  </div>

  <div class="section">
    <div class="label">Palette</div>
    <div class="chips" id="palettes"></div>
  </div>

  <details class="section" id="tune">
    <summary class="label">Tune agents</summary>
    <div id="sliders"></div>
    <div class="label" style="margin-top: 10px">Seed</div>
    <div class="chips" id="seeds"></div>
  </details>

  <div class="section">
    <div class="chips">
      <button id="randomize">⚄ randomize</button>
      <button id="pause">pause</button>
      <button id="share">copy link</button>
      <button id="snap">save png</button>
      <button id="record">● record</button>
    </div>
  </div>

  <div class="stats"><span id="agents"></span><span id="fps"></span></div>
  <div class="keys">
    drag = paint with brush · right/shift-drag = erase<br>
    <b>1</b><b>2</b><b>3</b> brush <b>space</b> pause <b>r</b> reseed <b>x</b> random
    <b>f</b> food <b>m</b> maze <b>c</b> clear <b>h</b> panel <b>s</b> png <b>v</b> video
  </div>
</div>
<div id="toast"></div>
<div id="drop">drop image → food</div>

<script>
const TAU = Math.PI * 2;
const EXPOSURE = 0.6;
const FOOD_RATE = 6;
const BRUSH_RADIUS = { food: 16, wall: 6, erase: 26 };

const PRESETS = {
  marble:    { palette: "ember",  seed: "scatter", species: 3, sensorAngle: 70, sensorDist: 10, turn: 70, speed: 1.2, decay: 0.82,  deposit: 1.0, repel: 0.8, density: 0.25 },
  network:   { palette: "petri",  seed: "scatter", scene: "dots", species: 1, sensorAngle: 45, sensorDist: 25, turn: 45, speed: 1.5, decay: 0.85, deposit: 0.5, repel: 0.0, density: 0.30 },
  maze:      { palette: "petri",  seed: "scatter", scene: "maze", species: 1, sensorAngle: 45, sensorDist: 12, turn: 45, speed: 1.0, decay: 0.85, deposit: 0.5, repel: 0.0, density: 0.10 },
  mycelium:  { palette: "mono",   seed: "scatter", species: 1, sensorAngle: 5,  sensorDist: 30, turn: 40, speed: 1.0, decay: 0.90,  deposit: 1.0, repel: 0.0, density: 0.20 },
  honeycomb: { palette: "ink",    seed: "scatter", species: 1, sensorAngle: 60, sensorDist: 12, turn: 30, speed: 1.0, decay: 0.70,  deposit: 0.4, repel: 0.0, density: 0.30 },
  rivers:    { palette: "aurora", seed: "scatter", species: 3, sensorAngle: 20, sensorDist: 40, turn: 6,  speed: 2.5, decay: 0.94,  deposit: 0.5, repel: 0.4, density: 0.20 },
  veins:     { palette: "abyss",  seed: "scatter", species: 1, sensorAngle: 30, sensorDist: 24, turn: 10, speed: 1.0, decay: 0.85,  deposit: 0.5, repel: 0.0, density: 0.30 },
  spores:    { palette: "aurora", seed: "scatter", species: 2, sensorAngle: 120, sensorDist: 8, turn: 20, speed: 1.0, decay: 0.85,  deposit: 1.0, repel: 1.0, density: 0.20 },
  coral:     { palette: "abyss",  seed: "ring",    species: 3, sensorAngle: 45, sensorDist: 10, turn: 20, speed: 1.0, decay: 0.88,  deposit: 0.6, repel: 0.3, density: 0.30 },
  galaxies:  { palette: "aurora", seed: "spiral",  species: 2, sensorAngle: 80, sensorDist: 20, turn: 12, speed: 1.3, decay: 0.93,  deposit: 1.0, repel: 1.6, density: 0.12 },
};

const SCRIBE = { species: 1, sensorAngle: 60, sensorDist: 12, turn: 30, speed: 1.0, decay: 0.7, deposit: 0.4, repel: 0.0, density: 0.3 };

function paramsOf(preset) {
  const { palette, seed, scene, ...params } = preset;
  return params;
}

const PALETTES = {
  abyss:  { bg: "#05060a", c: ["#3ef0c8", "#ff4fa3", "#ffd25a"] },
  ember:  { bg: "#0b0503", c: ["#ff7a2b", "#ffd166", "#e63946"] },
  aurora: { bg: "#03070c", c: ["#7cffb2", "#5ab8ff", "#c38bff"] },
  ink:    { bg: "#f1ece1", c: ["#151726", "#b3261e", "#2f6f4f"] },
  petri:  { bg: "#120d06", c: ["#ffc93c", "#ff8a3d", "#fff3c4"] },
  mono:   { bg: "#000000", c: ["#f5f5f0", "#9a9a95", "#5a5a58"] },
};

const SLIDERS = [
  ["species",     "species",      1,    3,     1],
  ["sensorAngle", "sensor angle", 2,    120,   1],
  ["sensorDist",  "sensor dist",  1,    48,    1],
  ["turn",        "turn speed",   1,    90,    1],
  ["speed",       "step size",    0.2,  3,     0.05],
  ["decay",       "trail decay",  0.5,  0.995, 0.005],
  ["deposit",     "deposit",      0.1,  5,     0.1],
  ["repel",       "repulsion",    0,    4,     0.05],
  ["density",     "density",      0.02, 0.4,   0.01],
];

const SEEDS = ["ring", "disc", "burst", "scatter", "spiral"];
const SCENE_KINDS = ["dots", "maze", "text"];

const DEFAULT_PRESET = "marble";
const state = {
  params: paramsOf(PRESETS[DEFAULT_PRESET]),
  palette: PRESETS[DEFAULT_PRESET].palette,
  seed: PRESETS[DEFAULT_PRESET].seed,
  scene: "",
  brush: "food",
  paused: false,
};

function hexToRgb(h) {
  const n = parseInt(h.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}

function outlineFor(pal) {
  const [r, g, b] = hexToRgb(pal.bg);
  return 0.2126 * r + 0.7152 * g + 0.0722 * b > 128 ? [40, 40, 50] : [235, 235, 230];
}

function wallFor(pal) {
  const bg = hexToRgb(pal.bg), o = outlineFor(pal);
  return bg.map((v, i) => v + (o[i] - v) * 0.13);
}

function smoothstep(a, b, x) {
  const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
}

function mulberry32(seed) {
  return () => {
    seed |= 0; seed = seed + 0x6d2b79f5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function makeAgents(W, H, p, seed, field) {
  const N = Math.max(1, Math.floor(W * H * p.density));
  const A = new Float32Array(N * 4);
  const cx = W / 2, cy = H / 2, R = Math.min(W, H) * 0.42;
  const blocked = (x, y) => field[((y | 0) * W + (x | 0)) * 4 + 1] > 0.5;
  for (let i = 0; i < N; i++) {
    const s = i % p.species;
    const t = Math.random() * TAU;
    let x, y, a;
    switch (seed) {
      case "ring": {
        const r = R * (0.92 + Math.random() * 0.08);
        x = cx + Math.cos(t) * r; y = cy + Math.sin(t) * r; a = t + Math.PI;
        break;
      }
      case "disc": {
        const r = R * Math.sqrt(Math.random());
        x = cx + Math.cos(t) * r; y = cy + Math.sin(t) * r; a = Math.atan2(cy - y, cx - x);
        break;
      }
      case "burst": {
        const r = Math.random() * 6;
        x = cx + Math.cos(t) * r; y = cy + Math.sin(t) * r; a = t;
        break;
      }
      case "spiral": {
        const k = i / N;
        const th = s * TAU / p.species + k * 9;
        x = cx + Math.cos(th) * R * k + (Math.random() - 0.5) * 4;
        y = cy + Math.sin(th) * R * k + (Math.random() - 0.5) * 4;
        a = th + Math.PI / 2;
        break;
      }
      default:
        x = Math.random() * W; y = Math.random() * H; a = t;
    }
    x = ((x % W) + W) % W;
    y = ((y % H) + H) % H;
    for (let tries = 0; tries < 30 && blocked(x, y); tries++) {
      x = Math.random() * W; y = Math.random() * H;
    }
    A[i * 4] = x;
    A[i * 4 + 1] = y;
    A[i * 4 + 2] = ((a % TAU) + TAU) % TAU;
    A[i * 4 + 3] = s;
  }
  return { data: A, count: N };
}

const GLSL_UPDATE = `#version 300 es
precision highp float;
precision highp int;
uniform sampler2D uAgents;
uniform sampler2D uTrail;
uniform sampler2D uField;
uniform sampler2D uScent;
uniform vec4 uScentMap;
uniform vec2 uScentSize;
uniform vec2 uRes;
uniform float uSA, uSD, uTS, uSP, uRepel;
uniform uint uFrame;
out vec4 o;

uint hash(uint x) {
  x ^= x >> 16; x *= 0x7feb352du;
  x ^= x >> 15; x *= 0x846ca68bu;
  x ^= x >> 16; return x;
}

float sense(vec2 p, float a, vec4 w) {
  vec2 sp = p + vec2(cos(a), sin(a)) * uSD;
  vec2 q = sp / uRes;
  vec2 g = ((sp - uScentMap.xy) / (uScentMap.z * 0.5) + 0.5) / uScentSize;
  return dot(textureLod(uTrail, q, 0.0), w)
       - textureLod(uField, q, 0.0).g * 1000.0
       + textureLod(uScent, g, 0.0).r * uScentMap.w;
}

float wallAt(vec2 p) {
  return texelFetch(uField, min(ivec2(p), ivec2(uRes) - 1), 0).g;
}

void main() {
  ivec2 c = ivec2(gl_FragCoord.xy);
  vec4 ag = texelFetch(uAgents, c, 0);
  vec2 p = ag.xy;
  float a = ag.z;
  float species = ag.w < 0.0 ? -ag.w - 1.0 : ag.w;
  int s = int(species + 0.5);
  vec4 w = mix(vec4(-uRepel), vec4(1.0), vec4(equal(ivec4(0, 1, 2, 3), ivec4(s))));
  w.a = 0.0;

  uint h = hash(uint(c.x) ^ (uint(c.y) << 12) ^ hash(uFrame));
  float r1 = float(h & 0xffffu) / 65535.0;
  float r2 = float(h >> 16) / 65535.0;

  float f = sense(p, a, w);
  float l = sense(p, a + uSA, w);
  float r = sense(p, a - uSA, w);

  if (f >= l && f >= r) {
    if (f == l && f == r) a += (r1 - 0.5) * uTS;
  } else if (f < l && f < r) {
    a += (r1 < 0.5 ? 1.0 : -1.0) * uTS;
  } else if (l > r) {
    a += uTS * (0.7 + 0.3 * r2);
  } else {
    a -= uTS * (0.7 + 0.3 * r2);
  }

  a = mod(a, 6.28318530718);
  vec2 np = mod(p + vec2(cos(a), sin(a)) * uSP, uRes);
  float tag = species;
  if (wallAt(np) > 0.5 && wallAt(p) <= 0.5) {
    a = mod(a + 3.14159265 + (r2 - 0.5) * 1.5, 6.28318530718);
    np = p;
    tag = -species - 1.0;
  }
  o = vec4(np, a, tag);
}`;

const GLSL_DEPOSIT_VS = `#version 300 es
precision highp float;
precision highp int;
uniform sampler2D uAgents;
uniform vec2 uRes;
uniform int uTexW;
uniform float uDeposit;
out vec4 vCol;

void main() {
  ivec2 c = ivec2(gl_VertexID % uTexW, gl_VertexID / uTexW);
  vec4 ag = texelFetch(uAgents, c, 0);
  gl_Position = ag.w < 0.0 ? vec4(2.0, 2.0, 0.0, 1.0) : vec4((floor(ag.xy) + 0.5) / uRes * 2.0 - 1.0, 0.0, 1.0);
  gl_PointSize = 1.0;
  vCol = vec4(equal(ivec4(0, 1, 2, 3), ivec4(int(ag.w + 0.5)))) * uDeposit;
}`;

const GLSL_DEPOSIT_FS = `#version 300 es
precision highp float;
in vec4 vCol;
out vec4 o;
void main() { o = vCol; }`;

const GLSL_DIFFUSE = `#version 300 es
precision highp float;
uniform sampler2D uTrail;
uniform sampler2D uField;
uniform sampler2D uScent;
uniform vec4 uScentMap;
uniform vec2 uScentSize;
uniform float uStarve;
uniform float uBarren;
uniform vec2 uRes;
uniform float uDecay;
uniform vec4 uMask;
uniform float uFoodRate;
out vec4 o;

void main() {
  vec2 t = 1.0 / uRes;
  vec2 uv = gl_FragCoord.xy * t;
  vec4 s = vec4(0.0);
  for (int y = -1; y <= 1; y++)
    for (int x = -1; x <= 1; x++)
      s += textureLod(uTrail, uv + vec2(x, y) * t, 0.0);
  s *= uDecay / 9.0;
  if (uScentMap.w > 0.0) {
    vec2 g = ((gl_FragCoord.xy - uScentMap.xy) / (uScentMap.z * 0.5) + 0.5) / uScentSize;
    s *= mix(uStarve, 1.0, clamp(textureLod(uScent, g, 0.0).r, 0.0, 1.0));
  }
  vec3 f = textureLod(uField, uv, 0.0).rgb;
  s += uMask * f.r * uFoodRate;
  s *= 1.0 - clamp(f.g, 0.0, 1.0);
  s *= mix(1.0, uBarren, clamp(f.b, 0.0, 1.0));
  float total = s.r + s.g + s.b;
  s.a = min(total * total / 64.0, 60000.0);
  o = s;
}`;

const GLSL_DISPLAY = `#version 300 es
precision highp float;
uniform sampler2D uTrail;
uniform sampler2D uField;
uniform vec2 uRes;
uniform float uMaxLod;
uniform float uExposure;
uniform vec3 uBg, uC0, uC1, uC2, uOutline, uWall;
out vec4 o;

void main() {
  vec2 uv = vec2(gl_FragCoord.x / uRes.x, 1.0 - gl_FragCoord.y / uRes.y);
  vec3 v = max(textureLod(uTrail, uv, 0.0).rgb, 0.0);
  vec4 m = textureLod(uTrail, vec2(0.5), uMaxLod);
  float K = max(0.05, uExposure * m.a * 64.0 / max(m.r + m.g + m.b, 1e-4));
  float t = v.r + v.g + v.b;
  vec3 col = uBg;
  if (t > 1e-4) {
    float I = t / (t + K);
    I = I * I * (3.0 - 2.0 * I);
    col += ((uC0 - uBg) * v.r + (uC1 - uBg) * v.g + (uC2 - uBg) * v.b) * (I / t);
  }
  vec2 f = textureLod(uField, uv, 0.0).rg;
  col = mix(col, uWall, smoothstep(0.3, 0.7, f.g));
  col = mix(col, uOutline, (smoothstep(0.2, 0.4, f.r) - smoothstep(0.6, 0.8, f.r)) * 0.7);
  o = vec4(col, 1.0);
}`;

const GLSL_QUAD = `#version 300 es
in vec2 aPos;
void main() { gl_Position = vec4(aPos, 0.0, 1.0); }`;

function createGpuEngine(canvas) {
  const gl = canvas.getContext("webgl2", { alpha: false, antialias: false, depth: false, stencil: false });
  if (!gl || !gl.getExtension("EXT_color_buffer_float")) return null;

  function program(vsSrc, fsSrc) {
    const p = gl.createProgram();
    for (const [type, src] of [[gl.VERTEX_SHADER, vsSrc], [gl.FRAGMENT_SHADER, fsSrc]]) {
      const sh = gl.createShader(type);
      gl.shaderSource(sh, src);
      gl.compileShader(sh);
      if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));
      gl.attachShader(p, sh);
    }
    gl.bindAttribLocation(p, 0, "aPos");
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    const u = {};
    const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
    for (let i = 0; i < n; i++) {
      const name = gl.getActiveUniform(p, i).name;
      u[name] = gl.getUniformLocation(p, name);
    }
    return { p, u };
  }

  let progs;
  try {
    progs = {
      update: program(GLSL_QUAD, GLSL_UPDATE),
      deposit: program(GLSL_DEPOSIT_VS, GLSL_DEPOSIT_FS),
      diffuse: program(GLSL_QUAD, GLSL_DIFFUSE),
      display: program(GLSL_QUAD, GLSL_DISPLAY),
    };
  } catch (err) {
    console.warn("webgl2 engine unavailable:", err);
    return null;
  }

  const quadVao = gl.createVertexArray();
  gl.bindVertexArray(quadVao);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  const emptyVao = gl.createVertexArray();

  const AGENT_TEX_W = 2048;
  let W = 0, H = 0, N = 0, agentTexH = 1, maxLod = 0, frame = 0;
  let trails = [], agents = [], fieldTex = null;
  let scentTex = gl.createTexture(), scentSize = [1, 1], scentMap = [0, 0, 1, 0];
  gl.bindTexture(gl.TEXTURE_2D, scentTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.R16F, 1, 1, 0, gl.RED, gl.FLOAT, new Float32Array(1));

  function target(tex) {
    const fb = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    return { tex, fb };
  }

  function dispose(list) {
    for (const t of list) { gl.deleteTexture(t.tex); gl.deleteFramebuffer(t.fb); }
  }

  function texture(levels, format, filter, wrap) {
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texStorage2D(gl.TEXTURE_2D, levels, format, W, H);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, wrap);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, wrap);
    return tex;
  }

  function resize(w, h) {
    W = w; H = h;
    canvas.width = W; canvas.height = H;
    dispose(trails);
    const levels = Math.floor(Math.log2(Math.max(W, H))) + 1;
    maxLod = levels - 1;
    trails = [0, 1].map(() => target(texture(levels, gl.RGBA16F, gl.LINEAR_MIPMAP_NEAREST, gl.REPEAT)));
    if (fieldTex) gl.deleteTexture(fieldTex);
    fieldTex = texture(1, gl.RGBA16F, gl.LINEAR, gl.REPEAT);
  }

  function setField(data, rect) {
    const { x0, y0, x1, y1 } = rect || { x0: 0, y0: 0, x1: W - 1, y1: H - 1 };
    gl.bindTexture(gl.TEXTURE_2D, fieldTex);
    gl.pixelStorei(gl.UNPACK_ROW_LENGTH, W);
    gl.pixelStorei(gl.UNPACK_SKIP_PIXELS, x0);
    gl.pixelStorei(gl.UNPACK_SKIP_ROWS, y0);
    gl.texSubImage2D(gl.TEXTURE_2D, 0, x0, y0, x1 - x0 + 1, y1 - y0 + 1, gl.RGBA, gl.FLOAT, data);
    gl.pixelStorei(gl.UNPACK_ROW_LENGTH, 0);
    gl.pixelStorei(gl.UNPACK_SKIP_PIXELS, 0);
    gl.pixelStorei(gl.UNPACK_SKIP_ROWS, 0);
  }

  function setScent(scent) {
    if (!scent) { scentMap = [0, 0, 1, 0]; return; }
    const { data, gw, gh, ox, oy, cell, weight } = scent;
    gl.bindTexture(gl.TEXTURE_2D, scentTex);
    if (gw !== scentSize[0] || gh !== scentSize[1]) {
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.R16F, gw, gh, 0, gl.RED, gl.FLOAT, data);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      scentSize = [gw, gh];
    } else {
      gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, gw, gh, gl.RED, gl.FLOAT, data);
    }
    scentMap = [ox, oy, cell, weight];
  }

  function seed({ data, count }) {
    N = count;
    agentTexH = Math.ceil(N / AGENT_TEX_W);
    const padded = new Float32Array(AGENT_TEX_W * agentTexH * 4);
    padded.set(data);
    dispose(agents);
    agents = [0, 1].map(() => {
      const tex = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, AGENT_TEX_W, agentTexH, 0, gl.RGBA, gl.FLOAT, padded);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
      return target(tex);
    });
    for (const t of trails) {
      gl.bindFramebuffer(gl.FRAMEBUFFER, t.fb);
      gl.clearColor(0, 0, 0, 0);
      gl.clear(gl.COLOR_BUFFER_BIT);
    }
  }

  function bindTex(unit, tex) {
    gl.activeTexture(gl.TEXTURE0 + unit);
    gl.bindTexture(gl.TEXTURE_2D, tex);
  }

  function step(p) {
    const { update, deposit, diffuse } = progs;

    gl.useProgram(update.p);
    gl.bindVertexArray(quadVao);
    gl.bindFramebuffer(gl.FRAMEBUFFER, agents[1].fb);
    gl.viewport(0, 0, AGENT_TEX_W, agentTexH);
    bindTex(0, agents[0].tex);
    bindTex(1, trails[0].tex);
    bindTex(2, fieldTex);
    bindTex(3, scentTex);
    gl.uniform1i(update.u.uAgents, 0);
    gl.uniform1i(update.u.uTrail, 1);
    gl.uniform1i(update.u.uField, 2);
    gl.uniform1i(update.u.uScent, 3);
    gl.uniform4f(update.u.uScentMap, scentMap[0], scentMap[1], scentMap[2], scentMap[3] * p.deposit);
    gl.uniform2f(update.u.uScentSize, scentSize[0], scentSize[1]);
    gl.uniform2f(update.u.uRes, W, H);
    gl.uniform1f(update.u.uSA, p.sensorAngle * Math.PI / 180);
    gl.uniform1f(update.u.uSD, p.sensorDist);
    gl.uniform1f(update.u.uTS, p.turn * Math.PI / 180);
    gl.uniform1f(update.u.uSP, p.speed);
    gl.uniform1f(update.u.uRepel, p.repel);
    gl.uniform1ui(update.u.uFrame, frame++);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    agents.reverse();

    gl.useProgram(deposit.p);
    gl.bindVertexArray(emptyVao);
    gl.bindFramebuffer(gl.FRAMEBUFFER, trails[0].fb);
    gl.viewport(0, 0, W, H);
    bindTex(0, agents[0].tex);
    gl.uniform1i(deposit.u.uAgents, 0);
    gl.uniform2f(deposit.u.uRes, W, H);
    gl.uniform1i(deposit.u.uTexW, AGENT_TEX_W);
    gl.uniform1f(deposit.u.uDeposit, p.deposit);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE);
    gl.drawArrays(gl.POINTS, 0, N);
    gl.disable(gl.BLEND);

    gl.useProgram(diffuse.p);
    gl.bindVertexArray(quadVao);
    gl.bindFramebuffer(gl.FRAMEBUFFER, trails[1].fb);
    bindTex(0, trails[0].tex);
    bindTex(1, fieldTex);
    bindTex(2, scentTex);
    gl.uniform1i(diffuse.u.uTrail, 0);
    gl.uniform1i(diffuse.u.uField, 1);
    gl.uniform1i(diffuse.u.uScent, 2);
    gl.uniform4f(diffuse.u.uScentMap, scentMap[0], scentMap[1], scentMap[2], scentMap[3]);
    gl.uniform2f(diffuse.u.uScentSize, scentSize[0], scentSize[1]);
    gl.uniform1f(diffuse.u.uStarve, STARVE);
    gl.uniform1f(diffuse.u.uBarren, BARREN);
    gl.uniform2f(diffuse.u.uRes, W, H);
    gl.uniform1f(diffuse.u.uDecay, p.decay);
    gl.uniform4f(diffuse.u.uMask, 1, p.species > 1 ? 1 : 0, p.species > 2 ? 1 : 0, 0);
    gl.uniform1f(diffuse.u.uFoodRate, FOOD_RATE * p.deposit);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    trails.reverse();
  }

  function draw(pal) {
    const { display } = progs;
    const unit = c => c.map(v => v / 255);
    bindTex(1, fieldTex);
    bindTex(0, trails[0].tex);
    gl.generateMipmap(gl.TEXTURE_2D);
    gl.useProgram(display.p);
    gl.bindVertexArray(quadVao);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, W, H);
    gl.uniform1i(display.u.uTrail, 0);
    gl.uniform1i(display.u.uField, 1);
    gl.uniform2f(display.u.uRes, W, H);
    gl.uniform1f(display.u.uMaxLod, maxLod);
    gl.uniform1f(display.u.uExposure, EXPOSURE);
    gl.uniform3fv(display.u.uBg, unit(hexToRgb(pal.bg)));
    gl.uniform3fv(display.u.uC0, unit(hexToRgb(pal.c[0])));
    gl.uniform3fv(display.u.uC1, unit(hexToRgb(pal.c[1])));
    gl.uniform3fv(display.u.uC2, unit(hexToRgb(pal.c[2])));
    gl.uniform3fv(display.u.uOutline, unit(outlineFor(pal)));
    gl.uniform3fv(display.u.uWall, unit(wallFor(pal)));
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  return { name: "webgl2", scale: 1, maxCells: 2560 * 1600, resize, setField, setScent, seed, step, draw };
}

function createCpuEngine(canvas) {
  const ctx = canvas.getContext("2d", { alpha: false });
  const LUT = 4096, LMASK = LUT - 1, LK = LUT / TAU;
  const COS = new Float32Array(LUT), SIN = new Float32Array(LUT);
  for (let i = 0; i < LUT; i++) { COS[i] = Math.cos(i / LK); SIN[i] = Math.sin(i / LK); }

  let W, H, N, A, maps, tmp, field, image, pixels, exposure = 1, scent = null, starve = null;

  function resize(w, h) {
    W = w; H = h;
    canvas.width = W; canvas.height = H;
    image = ctx.createImageData(W, H);
    pixels = new Uint32Array(image.data.buffer);
    maps = [0, 1, 2].map(() => new Float32Array(W * H));
    tmp = new Float32Array(W * H);
  }

  function setField(data) {
    field = data;
  }

  function setScent(value) {
    scent = value;
  }

  function scentAt(x, y) {
    const { data, gw, gh, ox, oy, cell } = scent;
    const gx = Math.min(gw - 1, Math.max(0, (x - ox) / (cell * 0.5)));
    const gy = Math.min(gh - 1, Math.max(0, (y - oy) / (cell * 0.5)));
    const x0 = Math.min(gw - 2, gx | 0), y0 = Math.min(gh - 2, gy | 0);
    const fx = gx - x0, fy = gy - y0, i = y0 * gw + x0;
    const top = data[i] + (data[i + 1] - data[i]) * fx;
    const bottom = data[i + gw] + (data[i + gw + 1] - data[i + gw]) * fx;
    return top + (bottom - top) * fy;
  }

  function seed({ data, count }) {
    A = data; N = count;
    for (const m of maps) m.fill(0);
  }

  function diffuse(m, decay) {
    for (let y = 0; y < H; y++) {
      const row = y * W;
      let prev = m[row + W - 1], cur = m[row];
      for (let x = 0; x < W; x++) {
        const next = m[row + (x + 1 === W ? 0 : x + 1)];
        tmp[row + x] = prev + cur + next;
        prev = cur; cur = next;
      }
    }
    const k = decay / 9;
    for (let x = 0; x < W; x++) {
      let prev = tmp[(H - 1) * W + x], cur = tmp[x];
      for (let y = 0; y < H; y++) {
        const next = tmp[(y + 1 === H ? 0 : y + 1) * W + x];
        m[y * W + x] = (prev + cur + next) * k;
        prev = cur; cur = next;
      }
    }
  }

  function step(p) {
    const S = p.species;
    const SAi = Math.round(p.sensorAngle * Math.PI / 180 * LK);
    const SD = p.sensorDist, SP = p.speed, DEP = p.deposit, REP = p.repel;
    const TS = p.turn * Math.PI / 180;
    const m0 = maps[0], m1 = maps[1], m2 = maps[2];
    const F = field;
    const SW = scent ? scent.weight * DEP : 0;

    const sense = (x, y, ai, s) => {
      ai &= LMASK;
      let sx = (x + COS[ai] * SD) | 0;
      let sy = (y + SIN[ai] * SD) | 0;
      if (sx < 0) sx += W; else if (sx >= W) sx -= W;
      if (sy < 0) sy += H; else if (sy >= H) sy -= H;
      const k = sy * W + sx;
      const wall = F[k * 4 + 1] * 1000 - (SW ? scentAt(sx, sy) * SW : 0);
      if (S === 1) return m0[k] - wall;
      const v0 = m0[k], v1 = m1[k], v2 = S === 3 ? m2[k] : 0;
      const own = s === 0 ? v0 : s === 1 ? v1 : v2;
      return own - REP * (v0 + v1 + v2 - own) - wall;
    };

    for (let i = 0, j = 0; i < N; i++, j += 4) {
      let x = A[j], y = A[j + 1], a = A[j + 2];
      const s = A[j + 3];
      const ai = (a * LK) | 0;
      const f = sense(x, y, ai, s);
      const l = sense(x, y, ai + SAi, s);
      const r = sense(x, y, ai - SAi, s);

      if (f >= l && f >= r) {
        if (f === l && f === r) a += (Math.random() - 0.5) * TS;
      } else if (f < l && f < r) {
        a += (Math.random() < 0.5 ? 1 : -1) * TS;
      } else if (l > r) {
        a += TS * (0.7 + Math.random() * 0.3);
      } else {
        a -= TS * (0.7 + Math.random() * 0.3);
      }
      if (a < 0) a += TAU; else if (a >= TAU) a -= TAU;

      const mi = (a * LK) & LMASK;
      let nx = x + COS[mi] * SP, ny = y + SIN[mi] * SP;
      if (nx < 0) nx += W; else if (nx >= W) nx -= W;
      if (ny < 0) ny += H; else if (ny >= H) ny -= H;
      const here = (y | 0) * W + (x | 0);
      const there = (ny | 0) * W + (nx | 0);
      if (F[there * 4 + 1] > 0.5 && F[here * 4 + 1] <= 0.5) {
        a += Math.PI + (Math.random() - 0.5) * 1.5;
        if (a >= TAU) a -= TAU;
        A[j + 2] = a;
        continue;
      }

      A[j] = nx; A[j + 1] = ny; A[j + 2] = a;
      const k = (ny | 0) * W + (nx | 0);
      if (k < W * H) maps[s][k] += DEP;
    }

    const rate = FOOD_RATE * p.deposit;
    if (scent) {
      if (!starve || starve.length !== W * H) starve = new Float32Array(W * H);
      for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
          starve[y * W + x] = STARVE + (1 - STARVE) * Math.min(1, Math.max(0, scentAt(x + 0.5, y + 0.5)));
        }
      }
    }
    for (let s = 0; s < S; s++) {
      diffuse(maps[s], p.decay);
      const m = maps[s];
      for (let i = 0, n = W * H; i < n; i++) {
        const food = F[i * 4], wall = F[i * 4 + 1], barren = F[i * 4 + 2];
        if (scent) m[i] *= starve[i];
        if (barren > 0) m[i] *= 1 - (1 - BARREN) * barren;
        if (food > 0 || wall > 0) m[i] = (m[i] + food * rate) * (1 - Math.min(1, wall));
      }
    }
  }

  function draw(pal, S) {
    const [br, bgG, bb] = hexToRgb(pal.bg);
    const c = pal.c.map(hexToRgb);
    const r0 = c[0][0] - br, g0 = c[0][1] - bgG, b0 = c[0][2] - bb;
    const r1 = c[1][0] - br, g1 = c[1][1] - bgG, b1 = c[1][2] - bb;
    const r2 = c[2][0] - br, g2 = c[2][1] - bgG, b2 = c[2][2] - bb;
    const m0 = maps[0], m1 = S > 1 ? maps[1] : null, m2 = S > 2 ? maps[2] : null;
    const K = exposure, n = W * H, F = field;
    const [or, og, ob] = outlineFor(pal);
    const [wr, wg, wb] = wallFor(pal);
    let sum = 0, sumSq = 0;

    for (let i = 0; i < n; i++) {
      const v0 = m0[i], v1 = m1 ? m1[i] : 0, v2 = m2 ? m2[i] : 0;
      const t = v0 + v1 + v2;
      sum += t;
      sumSq += t * t;
      let r = br, g = bgG, b = bb;
      if (t > 1e-4) {
        let I = t / (t + K);
        I = I * I * (3 - 2 * I);
        const w = I / t;
        r += (r0 * v0 + r1 * v1 + r2 * v2) * w;
        g += (g0 * v0 + g1 * v1 + g2 * v2) * w;
        b += (b0 * v0 + b1 * v1 + b2 * v2) * w;
      }
      const food = F[i * 4], wall = F[i * 4 + 1];
      if (wall > 0.3) {
        const e = smoothstep(0.3, 0.7, wall);
        r += (wr - r) * e; g += (wg - g) * e; b += (wb - b) * e;
      }
      if (food > 0.2 && food < 0.8) {
        const e = 0.7 * (1 - Math.abs(food - 0.5) / 0.3);
        r += (or - r) * e; g += (og - g) * e; b += (ob - b) * e;
      }
      pixels[i] = 0xff000000 | ((b < 0 ? 0 : b > 255 ? 255 : b) << 16) | ((g < 0 ? 0 : g > 255 ? 255 : g) << 8) | (r < 0 ? 0 : r > 255 ? 255 : r);
    }
    exposure += (Math.max(0.05, EXPOSURE * sumSq / Math.max(sum, 1e-4)) - exposure) * 0.15;
    ctx.putImageData(image, 0, 0);
  }

  return { name: "cpu", scale: 2, maxCells: 900 * 600, resize, setField, setScent, seed, step, draw };
}

let canvas = document.getElementById("c");
let engine = createGpuEngine(canvas);
if (!engine) {
  const fresh = canvas.cloneNode();
  canvas.replaceWith(fresh);
  canvas = fresh;
  engine = createCpuEngine(canvas);
}

canvas.addEventListener("webglcontextlost", e => e.preventDefault());
canvas.addEventListener("webglcontextrestored", () => location.reload());

let W = 0, H = 0, agentCount = 0, FIELD = new Float32Array(0), dirty = null;

function resize() {
  const w = innerWidth / engine.scale, h = innerHeight / engine.scale;
  const shrink = Math.sqrt(Math.min(1, engine.maxCells / (w * h)));
  W = Math.max(64, Math.floor(w * shrink));
  H = Math.max(64, Math.floor(h * shrink));
  engine.resize(W, H);
  FIELD = new Float32Array(W * H * 4);
  buildScene(state.scene);
  reseed();
}

function reseed() {
  const agents = makeAgents(W, H, state.params, state.seed, FIELD);
  agentCount = agents.count;
  engine.seed(agents);
  document.getElementById("agents").textContent = `${agentCount.toLocaleString()} agents · ${engine.name}`;
}

const simScale = () => W / innerWidth;

function markDirty(x0, y0, x1, y1) {
  dirty = dirty
    ? { x0: Math.min(dirty.x0, x0), y0: Math.min(dirty.y0, y0), x1: Math.max(dirty.x1, x1), y1: Math.max(dirty.y1, y1) }
    : { x0, y0, x1, y1 };
}

function stamp(cx, cy, r, mode) {
  const x0 = Math.max(0, Math.floor(cx - r)), x1 = Math.min(W - 1, Math.ceil(cx + r));
  const y0 = Math.max(0, Math.floor(cy - r)), y1 = Math.min(H - 1, Math.ceil(cy + r));
  if (x0 > x1 || y0 > y1) return;
  for (let y = y0; y <= y1; y++) {
    for (let x = x0; x <= x1; x++) {
      const d = Math.hypot(x + 0.5 - cx, y + 0.5 - cy);
      if (d > r) continue;
      const i = (y * W + x) * 4;
      if (mode === "food") {
        FIELD[i] = Math.max(FIELD[i], 1 - smoothstep(r * 0.5, r, d));
      } else if (mode === "wall") {
        FIELD[i + 1] = Math.max(FIELD[i + 1], 1 - smoothstep(r - 1.5, r, d));
      } else {
        const k = 1 - smoothstep(r * 0.6, r, d);
        FIELD[i] *= 1 - k;
        FIELD[i + 1] *= 1 - k;
      }
    }
  }
  markDirty(x0, y0, x1, y1);
}

function stroke(from, to, mode) {
  const k = simScale();
  const r = Math.max(2, BRUSH_RADIUS[mode] * k);
  const dist = Math.hypot(to.x - from.x, to.y - from.y) * k;
  const steps = Math.max(1, Math.ceil(dist / (r * 0.35)));
  for (let i = 1; i <= steps; i++) {
    const t = i / steps;
    stamp((from.x + (to.x - from.x) * t) * k, (from.y + (to.y - from.y) * t) * k, r, mode);
  }
}

function flushField() {
  if (!dirty) return;
  engine.setField(FIELD, dirty);
  dirty = null;
}

function dotsScene(rand, count) {
  const k = simScale();
  const minGap = Math.min(W, H) * 0.14;
  const placed = [];
  for (let tries = 0; placed.length < count && tries < count * 60; tries++) {
    const x = W * (0.06 + rand() * 0.88), y = H * (0.06 + rand() * 0.88);
    if (placed.some(([px, py]) => Math.hypot(px - x, py - y) < minGap)) continue;
    if (FIELD[((y | 0) * W + (x | 0)) * 4 + 1] > 0.5) continue;
    placed.push([x, y]);
    stamp(x, y, Math.max(4, 16 * k), "food");
  }
}

function mazeScene(rand) {
  const k = simScale();
  const cell = Math.max(14, Math.round(64 * k));
  const cols = Math.max(2, Math.floor((W - cell) / cell));
  const rows = Math.max(2, Math.floor((H - cell) / cell));
  const ox = Math.floor((W - cols * cell) / 2), oy = Math.floor((H - rows * cell) / 2);
  const t = Math.max(2, Math.round(cell * 0.2));

  for (let i = 1; i < FIELD.length; i += 4) FIELD[i] = 1;
  const open = (x0, y0, x1, y1) => {
    for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) FIELD[(y * W + x) * 4 + 1] = 0;
  };
  const inner = (c, r) => [ox + c * cell + t, oy + r * cell + t, ox + (c + 1) * cell - t, oy + (r + 1) * cell - t];

  const edges = [];
  const linked = new Set();
  const connect = (c, r, nc, nr) => {
    const a = r * cols + c, b = nr * cols + nc;
    linked.add(Math.min(a, b) * cols * rows + Math.max(a, b));
    edges.push({ a, b, D: 1 });
    const ra = inner(c, r), rb = inner(nc, nr);
    open(Math.min(ra[0], rb[0]), Math.min(ra[1], rb[1]), Math.max(ra[2], rb[2]), Math.max(ra[3], rb[3]));
  };

  const seen = new Uint8Array(cols * rows);
  const stack = [[0, 0]];
  seen[0] = 1;
  open(...inner(0, 0));
  while (stack.length) {
    const [c, r] = stack[stack.length - 1];
    const next = [[1, 0], [-1, 0], [0, 1], [0, -1]]
      .map(([dc, dr]) => [c + dc, r + dr])
      .filter(([nc, nr]) => nc >= 0 && nr >= 0 && nc < cols && nr < rows && !seen[nr * cols + nc]);
    if (!next.length) { stack.pop(); continue; }
    const [nc, nr] = next[Math.floor(rand() * next.length)];
    seen[nr * cols + nc] = 1;
    connect(c, r, nc, nr);
    stack.push([nc, nr]);
  }
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      for (const [nc, nr] of [[c + 1, r], [c, r + 1]]) {
        if (nc >= cols || nr >= rows) continue;
        const a = r * cols + c, b = nr * cols + nc;
        if (!linked.has(a * cols * rows + b) && rand() < 0.12) connect(c, r, nc, nr);
      }
    }
  }

  const foodR = cell * 0.3;
  stamp(ox + cell / 2, oy + cell / 2, foodR, "food");
  stamp(ox + (cols - 0.5) * cell, oy + (rows - 0.5) * cell, foodR, "food");

  solver = {
    cols, rows, ox, oy, cell, edges,
    source: 0, sink: cols * rows - 1,
    p: new Float64Array(cols * rows),
    gw: cols * 2 + 1, gh: rows * 2 + 1,
    grid: new Float32Array((cols * 2 + 1) * (rows * 2 + 1)),
  };
  solver.adj = Array.from({ length: cols * rows }, () => []);
  for (const e of edges) { solver.adj[e.a].push(e); solver.adj[e.b].push(e); }
  publishScent();
}

let solver = null;
const SCENT_WEIGHT = 40;
const STARVE = 0.8;
const BARREN = 0.3;
const TERO_DT = 0.04;

function solverStep() {
  const { p, adj, edges, source, sink } = solver;
  for (let iter = 0; iter < 120; iter++) {
    for (let i = 0; i < p.length; i++) {
      if (i === sink) continue;
      let num = i === source ? 1 : 0, den = 0;
      for (const e of adj[i]) {
        const j = e.a === i ? e.b : e.a;
        const c = e.D + 1e-6;
        num += c * p[j];
        den += c;
      }
      p[i] = num / den;
    }
  }
  for (const e of edges) {
    const q = Math.abs((e.D + 1e-6) * (p[e.a] - p[e.b]));
    e.D += TERO_DT * (q - e.D);
  }
  publishScent();
}

function publishScent() {
  const { cols, grid, gw, edges, adj } = solver;
  const v = adj.map(list => list.reduce((m, e) => Math.max(m, e.D), 0));
  grid.fill(0);
  const node = i => [(i % cols) * 2 + 1, Math.floor(i / cols) * 2 + 1];
  for (let i = 0; i < adj.length; i++) {
    const [gx, gy] = node(i);
    grid[gy * gw + gx] = v[i];
  }
  for (const e of edges) {
    const [ax, ay] = node(e.a), [bx, by] = node(e.b);
    grid[((ay + by) / 2) * gw + (ax + bx) / 2] = e.D;
  }
  engine.setScent({ data: grid, gw, gh: solver.gh, ox: solver.ox, oy: solver.oy, cell: solver.cell, weight: SCENT_WEIGHT });
}

function rasterScene(paint) {
  const off = document.createElement("canvas");
  off.width = W; off.height = H;
  const c = off.getContext("2d", { willReadFrequently: true });
  paint(c);
  const px = c.getImageData(0, 0, W, H).data;
  return i => px[i * 4] / 255;
}

function textScene(text) {
  const lum = rasterScene(c => {
    c.fillStyle = "#000";
    c.fillRect(0, 0, W, H);
    let size = Math.min(H * 0.5, (W * 0.88) / Math.max(1, text.length * 0.6));
    c.font = `900 ${size}px system-ui, sans-serif`;
    size *= Math.min(1, (W * 0.88) / c.measureText(text).width);
    c.font = `900 ${size}px system-ui, sans-serif`;
    c.textAlign = "center";
    c.textBaseline = "middle";
    c.fillStyle = "#fff";
    c.filter = `blur(${Math.max(1, 2 * simScale())}px)`;
    c.fillText(text, W / 2, H / 2);
  });
  for (let i = 0, n = W * H; i < n; i++) FIELD[i * 4 + 2] = 1 - lum(i);
}

function imageScene(bitmap) {
  const s = Math.min(W / bitmap.width, H / bitmap.height) * 0.92;
  const w = bitmap.width * s, h = bitmap.height * s;
  const x0 = (W - w) / 2, y0 = (H - h) / 2;
  const lum = rasterScene(c => {
    c.fillStyle = "#000";
    c.fillRect(0, 0, W, H);
    c.filter = "grayscale(1)";
    c.drawImage(bitmap, x0, y0, w, h);
  });
  let mean = 0, count = 0;
  for (let y = y0; y < y0 + h; y += 3) for (let x = x0; x < x0 + w; x += 3) { mean += lum((y | 0) * W + (x | 0)); count++; }
  const invert = mean / Math.max(1, count) > 0.5;
  FIELD.fill(0);
  solver = null;
  engine.setScent(null);
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const i = y * W + x;
      const inside = x >= x0 && x < x0 + w && y >= y0 && y < y0 + h;
      const v = inside ? (invert ? 1 - lum(i) : lum(i)) : 0;
      FIELD[i * 4 + 2] = 1 - smoothstep(0.15, 0.85, v);
    }
  }
  dirty = null;
  engine.setField(FIELD, null);
  state.scene = "";
  writeHash();
}

function buildScene(desc) {
  FIELD.fill(0);
  solver = null;
  engine.setScent(null);
  const cut = desc.indexOf("-");
  const kind = cut < 0 ? desc : desc.slice(0, cut);
  const arg = cut < 0 ? "" : desc.slice(cut + 1);
  if (kind === "dots") dotsScene(mulberry32(+arg || 1), 12);
  else if (kind === "maze") mazeScene(mulberry32(+arg || 1));
  else if (kind === "text") textScene(safeDecode(arg));
  dirty = null;
  engine.setField(FIELD, null);
}

function safeDecode(s) {
  try { return decodeURIComponent(s); } catch { return s; }
}

function setScene(desc) {
  state.scene = desc;
  buildScene(desc);
  reseed();
  writeHash();
}

const newSeed = () => Math.floor(Math.random() * 1e6);

let pointer = null;
canvas.addEventListener("contextmenu", e => e.preventDefault());
canvas.addEventListener("pointerdown", e => {
  canvas.setPointerCapture(e.pointerId);
  const mode = e.shiftKey || e.button === 2 ? "erase" : state.brush;
  pointer = { x: e.clientX, y: e.clientY, mode };
  stroke(pointer, pointer, mode);
});
canvas.addEventListener("pointermove", e => {
  if (!pointer) return;
  const next = { x: e.clientX, y: e.clientY };
  stroke(pointer, next, pointer.mode);
  pointer.x = next.x; pointer.y = next.y;
});
addEventListener("pointerup", () => { pointer = null; });

let recorder = null, recStart = 0;
function toggleRecord() {
  if (recorder) { recorder.stop(); return; }
  if (!canvas.captureStream || typeof MediaRecorder === "undefined") { toast("recording not supported here"); return; }
  const mime = ["video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm", "video/mp4"].find(m => MediaRecorder.isTypeSupported(m));
  const chunks = [];
  const rec = new MediaRecorder(canvas.captureStream(60), mime ? { mimeType: mime, videoBitsPerSecond: 12e6 } : undefined);
  rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  rec.onstop = () => {
    const blob = new Blob(chunks, { type: rec.mimeType || "video/webm" });
    const url = URL.createObjectURL(blob);
    download(url, `physarum-${Date.now()}.${blob.type.includes("mp4") ? "mp4" : "webm"}`);
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    recorder = null;
    syncUI();
    toast(`saved ${(blob.size / 1e6).toFixed(1)} MB video`);
  };
  rec.start(250);
  recorder = rec;
  recStart = performance.now();
  syncUI();
  toast("recording… press v to stop");
}

function download(href, name) {
  const a = document.createElement("a");
  a.download = name;
  a.href = href;
  a.click();
}

let frames = 0, lastFps = performance.now();
function loop(now) {
  flushField();
  if (!state.paused) {
    if (solver) solverStep();
    engine.step(state.params);
  }
  engine.draw(PALETTES[state.palette], state.params.species);
  frames++;
  if (now - lastFps > 500) {
    const fps = `${Math.round(frames * 1000 / (now - lastFps))} fps`;
    const rec = recorder ? `● ${Math.floor((now - recStart) / 1000)}s · ` : "";
    document.getElementById("fps").textContent = rec + fps;
    frames = 0; lastFps = now;
  }
  requestAnimationFrame(loop);
}

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove("show"), 1600);
}

function chip(host, name, html, onclick) {
  const b = document.createElement("button");
  b.dataset.name = name;
  b.innerHTML = html;
  b.onclick = onclick;
  document.getElementById(host).appendChild(b);
}

const sliderEls = {};
function buildUI() {
  const host = document.getElementById("sliders");
  for (const [key, label, min, max, stepSize] of SLIDERS) {
    const row = document.createElement("label");
    row.className = "row";
    row.innerHTML = `<span>${label}</span><input type="range" min="${min}" max="${max}" step="${stepSize}"><output></output>`;
    const input = row.querySelector("input"), out = row.querySelector("output");
    input.addEventListener("input", () => {
      state.params[key] = parseFloat(input.value);
      out.textContent = fmt(state.params[key]);
      if (key === "species" || key === "density") reseed();
      markPreset(null);
      writeHash();
    });
    sliderEls[key] = { input, out };
    host.appendChild(row);
  }

  for (const name of Object.keys(PRESETS)) chip("presets", name, name, () => applyPreset(name));
  for (const [name, pal] of Object.entries(PALETTES)) {
    const swatch = `<span class="swatch">${pal.c.map(c => `<i style="background:${c}"></i>`).join("")}</span>`;
    chip("palettes", name, swatch + name, () => { state.palette = name; syncUI(); writeHash(); });
  }
  for (const name of SEEDS) chip("seeds", name, name, () => { state.seed = name; reseed(); syncUI(); writeHash(); });
  for (const name of Object.keys(BRUSH_RADIUS)) chip("brushes", name, name, () => setBrush(name));

  document.getElementById("scene-dots").onclick = () => setScene(`dots-${newSeed()}`);
  document.getElementById("scene-maze").onclick = () => setScene(`maze-${newSeed()}`);
  document.getElementById("scene-clear").onclick = () => setScene("");
  document.getElementById("write").onsubmit = e => {
    e.preventDefault();
    const input = document.getElementById("write-text");
    const text = input.value.trim();
    if (!text) return;
    input.blur();
    state.params = { ...state.params, ...SCRIBE };
    syncUI();
    markPreset(null);
    setScene(`text-${encodeURIComponent(text)}`);
  };

  document.getElementById("toggle").onclick = togglePanel;
  document.getElementById("randomize").onclick = randomize;
  document.getElementById("pause").onclick = togglePause;
  document.getElementById("snap").onclick = snapshot;
  document.getElementById("record").onclick = toggleRecord;
  document.getElementById("share").onclick = () => {
    writeHash();
    navigator.clipboard?.writeText(location.href).then(() => toast("link copied"), () => toast("copy failed"));
  };
}

function fmt(v) {
  return Number.isInteger(v) ? String(v) : v.toFixed(v < 1 ? 3 : 2).replace(/0+$/, "").replace(/\.$/, "");
}

function syncUI() {
  for (const [key, { input, out }] of Object.entries(sliderEls)) {
    input.value = state.params[key];
    out.textContent = fmt(state.params[key]);
  }
  const mark = (host, value) => {
    for (const b of document.querySelectorAll(`#${host} button`)) b.classList.toggle("on", b.dataset.name === value);
  };
  mark("palettes", state.palette);
  mark("seeds", state.seed);
  mark("brushes", state.brush);
  document.getElementById("pause").textContent = state.paused ? "play" : "pause";
  const rec = document.getElementById("record");
  rec.textContent = recorder ? "■ stop" : "● record";
  rec.classList.toggle("rec", !!recorder);
  const pal = PALETTES[state.palette];
  document.documentElement.style.setProperty("--accent", state.palette === "ink" ? pal.c[1] : pal.c[0]);
}

function markPreset(name) {
  for (const b of document.querySelectorAll("#presets button")) b.classList.toggle("on", b.dataset.name === name);
}

function setBrush(name) {
  state.brush = name;
  syncUI();
}

function applyPreset(name) {
  const preset = PRESETS[name];
  state.params = paramsOf(preset);
  state.palette = preset.palette;
  state.seed = preset.seed;
  state.scene = preset.scene ? `${preset.scene}-${newSeed()}` : "";
  buildScene(state.scene);
  reseed();
  syncUI();
  markPreset(name);
  writeHash();
}

function randomize() {
  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = list => list[Math.floor(Math.random() * list.length)];
  const species = 1 + Math.floor(Math.random() * 3);
  state.params = {
    species,
    sensorAngle: Math.round(rnd(8, 90)),
    sensorDist: Math.round(rnd(3, 32)),
    turn: Math.round(rnd(6, 50)),
    speed: +rnd(0.6, 2).toFixed(2),
    decay: +rnd(0.82, 0.96).toFixed(3),
    deposit: +rnd(0.5, 2.5).toFixed(1),
    repel: species > 1 ? +rnd(0.3, 2.5).toFixed(2) : 0,
    density: +rnd(0.08, 0.2).toFixed(2),
  };
  state.seed = pick(SEEDS);
  state.palette = pick(Object.keys(PALETTES));
  reseed();
  syncUI();
  markPreset(null);
  writeHash();
  toast("new organism");
}

function togglePause() {
  state.paused = !state.paused;
  syncUI();
}

function togglePanel() {
  document.getElementById("panel").classList.toggle("hidden");
}

function snapshot() {
  engine.draw(PALETTES[state.palette], state.params.species);
  download(canvas.toDataURL("image/png"), `physarum-${Date.now()}.png`);
  toast("saved png");
}

function writeHash() {
  const nums = SLIDERS.map(([k]) => state.params[k]).join(",");
  const scene = state.scene ? `/${state.scene}` : "";
  history.replaceState(null, "", `#${state.palette}/${state.seed}/${nums}${scene}`);
}

function readHash() {
  const [pal, seed, nums, scene = ""] = location.hash.slice(1).split("/");
  if (!nums) return false;
  const vals = nums.split(",").map(Number);
  if (vals.length !== SLIDERS.length || vals.some(Number.isNaN)) return false;
  SLIDERS.forEach(([k, , min, max], i) => { state.params[k] = Math.min(max, Math.max(min, vals[i])); });
  state.params.species = Math.round(state.params.species);
  if (PALETTES[pal]) state.palette = pal;
  if (SEEDS.includes(seed)) state.seed = seed;
  state.scene = SCENE_KINDS.includes(scene.split("-")[0]) ? scene : "";
  return true;
}

addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.matches("input[type=text]")) return;
  if (e.target.tagName === "INPUT" && e.key !== " ") return;
  switch (e.key.toLowerCase()) {
    case " ": e.preventDefault(); togglePause(); break;
    case "1": setBrush("food"); break;
    case "2": setBrush("wall"); break;
    case "3": setBrush("erase"); break;
    case "r": reseed(); break;
    case "x": randomize(); break;
    case "f": setScene(`dots-${newSeed()}`); break;
    case "m": setScene(`maze-${newSeed()}`); break;
    case "c": setScene(""); toast("scene cleared"); break;
    case "h": togglePanel(); break;
    case "s": snapshot(); break;
    case "v": toggleRecord(); break;
  }
});

const dropZone = document.getElementById("drop");
addEventListener("dragover", e => { e.preventDefault(); dropZone.classList.add("show"); });
addEventListener("dragleave", e => { if (!e.relatedTarget) dropZone.classList.remove("show"); });
addEventListener("drop", async e => {
  e.preventDefault();
  dropZone.classList.remove("show");
  const file = [...(e.dataTransfer?.files || [])].find(f => f.type.startsWith("image/"));
  if (!file) { toast("drop an image file"); return; }
  try {
    state.params = { ...state.params, ...SCRIBE };
    syncUI();
    markPreset(null);
    imageScene(await createImageBitmap(file));
    reseed();
    toast("image → food");
  } catch {
    toast("couldn't read that image");
  }
});

addEventListener("hashchange", () => {
  if (!readHash()) return;
  buildScene(state.scene);
  reseed();
  syncUI();
  markPreset(null);
});

let resizeTimer;
addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(resize, 200);
});

buildUI();
if (matchMedia("(max-width: 640px)").matches) document.getElementById("panel").classList.add("hidden");
const fromHash = readHash();
syncUI();
markPreset(fromHash ? null : DEFAULT_PRESET);
resize();
requestAnimationFrame(loop);
</script>
